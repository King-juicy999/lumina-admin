<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Lumina Admin | Inbox</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Schibsted+Grotesk:wght@400;500;600;700;800&family=Fragment+Mono&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-page="inbox">
    <header class="plate-nav">
      <div class="container plate-nav__inner">
        <a href="index.html" class="plate-brand">
          <span class="plate-brand__name">Lumina</span>
          <span class="plate-brand__tag">Admin Console</span>
        </a>
        <nav class="plate-links" aria-label="Admin sections">
          <a href="index.html">Overview</a>
          <a href="materials.html">Materials</a>
          <a href="users.html">Users</a>
          <a href="requests.html" data-role="super" hidden>Ban requests</a>
          <a href="recycle.html" data-role="super" hidden>Recycle bin</a>
          <a href="admins.html" data-role="super" hidden>Admins</a>
          <a href="inbox.html" data-role="owner" hidden aria-current="page">Inbox <span class="inbox-badge" id="inbox-badge" hidden>0</span></a>
          <button type="button" class="plate-btn plate-btn--logout" id="logout-btn">Sign out</button>
        </nav>
      </div>
    </header>
    <main>
      <section class="lp-section">
        <div class="container">
          <div class="band-label">
            <h1>Inbox</h1>
            <span class="band-rule" aria-hidden="true"></span>
            <span class="results-count" id="results-count">0 notes</span>
          </div>
          <div class="inbox-summary" id="summary-row" hidden>
            <div class="summary-chips" id="summary-chips"></div>
          </div>
          <div class="control-bar" role="search">
            <div class="field field-menu">
              <label class="field-label" for="filter-category">Category</label>
              <select id="filter-category" class="field-select">
                <option value="">All categories</option>
                <option value="Broken">Broken</option>
                <option value="Confusing">Confusing</option>
                <option value="Missing">Missing</option>
                <option value="Idea">Idea</option>
                <option value="General">General</option>
              </select>
            </div>
            <div class="field field-menu">
              <label class="field-label" for="filter-status">Status</label>
              <select id="filter-status" class="field-select">
                <option value="">All statuses</option>
                <option value="new">New</option>
                <option value="seen">Seen</option>
                <option value="planned">Planned</option>
                <option value="fixed">Fixed</option>
                <option value="declined">Declined</option>
              </select>
            </div>
          </div>
          <div class="loading-state" id="loading" hidden>Loading inbox</div>
          <div class="error-state" id="error" hidden>
            <span>Inbox could not be loaded.</span>
            <button type="button" class="error-state__retry" id="retry-btn">Try again</button>
          </div>
          <div class="records-grid" id="notes-grid"></div>
          <div class="empty-state" id="empty-state" hidden>
            <p>No notes yet.</p>
          </div>
        </div>
      </section>
    </main>
    <footer class="colophon">
      <div class="container colophon__inner">
        <p>Private console &middot; not student facing</p>
        <nav>
          <a href="index.html">Overview</a>
          <a href="materials.html">Materials</a>
          <a href="users.html">Users</a>
          <a href="requests.html" data-role="super" hidden>Ban requests</a>
          <a href="recycle.html" data-role="super" hidden>Recycle bin</a>
          <a href="admins.html" data-role="super" hidden>Admins</a>
          <a href="inbox.html" data-role="owner" hidden>Inbox</a>
        </nav>
      </div>
    </footer>
    <p class="notice" id="notice" role="status" aria-live="polite"></p>
    <script src="js/hierarchy.js"></script>
    <script src="js/session.js"></script>
    <script src="js/modal.js"></script>
    <script src="js/inbox.js"></script>
  </body>
</html>
